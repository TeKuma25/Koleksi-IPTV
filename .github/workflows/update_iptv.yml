name: Auto Update IPTV Playlists

on:
  schedule:
    # Berjalan otomatis setiap 12 jam (pukul 00:00 dan 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Tombol manual trigger di tab Actions GitHub

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Stream Checker
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cek apakah ada perubahan file m3u
          if [ -n "$(git status --porcelain *.m3u)" ]; then
            git add *.m3u
            git commit -m "Auto-update IPTV playlists (active streams checked) [skip ci]"
            git push
          else
            echo "Tidak ada perubahan pada file playlist."
          fi
